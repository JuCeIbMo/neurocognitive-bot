[project]
name = "neurocognitive-bot"
version = "0.1.0"
description = "WhatsApp chatbot for Neurocognitive Academy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-openai>=0.3.0",
    "httpx>=0.28.0",
    "supabase>=2.0.0",
    "pydantic-settings>=2.7.0",
    "langfuse>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "langchain>=1.2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
